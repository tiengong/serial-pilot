name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # 版本验证
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]*)?$ ]]; then
            echo "Version format is valid: $VERSION"
          else
            echo "Invalid version format: $VERSION"
            echo "Expected format: v1.0.0 or v1.0.0-alpha1"
            exit 1
          fi

  # 生成发布说明
  changelog:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "## Changes since $PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "## Initial Release" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" --all >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  # 构建所有平台的 Release 版本
  build:
    needs: [validate, changelog]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 版本
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            ext: .exe
            msi-name: serial-pilot_x64.msi
            portable-name: serial-pilot_x64.exe

          # Linux 版本
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: ""
            appimage-name: serial-pilot_amd64.AppImage
            deb-name: serial-pilot_amd64.deb
            rpm-name: serial-pilot_x86_64.rpm

          # macOS Intel 版本
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
            ext: ""
            dmg-name: Serial	s-Pilot_x64.dmg

          # macOS Apple Silicon 版本
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: ""
            dmg-name: Serial	s-Pilot_arm64.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install dependencies
        run: npm ci

      - name: Update version
        if: github.event.inputs.version != ''
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          cd src-tauri
          cargo install cargo-edit
          cargo set-version ${{ github.event.inputs.version }}

      - name: Build frontend (Release)
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          VITE_BUILD_DATE: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          VITE_COMMIT_HASH: ${GITHUB_SHA::7}
          VITE_DEBUG: "false"

      - name: Build Tauri (Release)
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Sign Windows binaries
        if: matrix.os == 'windows-latest' && env.CERTIFICATE != ''
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # 对可执行文件进行签名
          $files = @(
            "src-tauri/target/release/serial-pilot.exe",
            "src-tauri/target/release/bundle/nsis/*.exe"
          )

          foreach ($file in $files) {
            if (Test-Path $file) {
              Write-Host "Signing $file"
              & signtool sign /f $env:CERTIFICATE /p $env:CERTIFICATE_PASSWORD /t http://timestamp.digicert.com /v $file
            }
          }

      - name: Notarize macOS app
        if: matrix.os == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 导入证书
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          # 签名应用
          find src-tauri/target/release/bundle -name "*.app" -type d | while read app; do
            codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" "$app"
          done

      - name: Upload Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 30

      - name: Upload Portable Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: release-portable-${{ matrix.suffix }}
          path: |
            src-tauri/target/release/*${{ matrix.ext }}
            !src-tauri/target/release/deps/
            !src-tauri/target/release/build/
            !src-tauri/target/release/.fingerprint/
          retention-days: 30

  # 创建发布
  release:
    needs: [validate, changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} \; > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Serial Pilot ${{ github.event.inputs.version || github.ref_name }}
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## Serial Pilot ${{ github.event.inputs.version || github.ref_name }}

            **Build Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            **Commit**: ${GITHUB_SHA::7}

            ${{ needs.changelog.outputs.changelog }}

            ### 📥 Downloads

            #### Windows
            - **MSI Installer**: `serial-pilot_${{ github.event.inputs.version || github.ref_name }}_x64.msi`
            - **Portable Executable**: `serial-pilot_${{ github.event.inputs.version || github.ref_name }}_x64.exe`
            - **Green Version**: No installation required, just download and run

            #### macOS
            - **Intel (x64)**: `Serial-Pilot_${{ github.event.inputs.version || github.ref_name }}_x64.dmg`
            - **Apple Silicon (ARM64)**: `Serial-Pilot_${{ github.event.inputs.version || github.ref_name }}_arm64.dmg`

            #### Linux
            - **AppImage**: `serial-pilot_${{ github.event.inputs.version || github.ref_name }}_amd64.AppImage`
            - **DEB Package**: `serial-pilot_${{ github.event.inputs.version || github.ref_name }}_amd64.deb`
            - **RPM Package**: `serial-pilot_${{ github.event.inputs.version || github.ref_name }}_x86_64.rpm`

            ### ✨ Features
            - **Dual-channel Serial Communication**: Support P1 and P2 ports simultaneously
            - **Test Case Management**: Create, edit, and run test cases
            - **Real-time Data Monitoring**: Live data display with customizable formatting
            - **Cross-platform Support**: Windows, macOS, and Linux
            - **Tauri Native Integration**: Enhanced serial port detection
            - **Internationalization**: Multi-language support

            ### 🚀 Installation

            #### Windows
            1. **MSI Installer** (Recommended): Download and run the MSI file
            2. **Portable**: Download the EXE file and run directly
            3. **Green Version**: No installation required, just download and run

            #### macOS
            1. Download the appropriate DMG for your architecture
            2. Open the DMG and drag the app to Applications
            3. Run from Applications or Launchpad

            #### Linux
            - **AppImage**: Download, make executable (`chmod +x`), and run
            - **DEB**: `sudo dpkg -i serial-pilot_*.deb`
            - **RPM**: `sudo rpm -i serial-pilot_*.rpm`

            ### 🔧 System Requirements
            - **Windows**: Windows 10 or later
            - **macOS**: macOS 10.15 or later
            - **Linux**: Ubuntu 18.04+, Fedora 30+, or equivalent

            ### 📝 Notes
            - **Serial Port Access**: May require administrator/sudo privileges
            - **Debug Builds**: Available in Actions artifacts for troubleshooting
            - **Checksums**: Verify downloads using provided checksums.txt

            ### 🐛 Debug Information
            For issues and debugging:
            - Check the logs in the application data directory
            - Use debug builds for detailed console output
            - Report issues at: https://github.com/${{ github.repository }}/issues

            ### 📄 License
            This software is released under the terms of the project license.
          files: |
            artifacts/release-*/*
            artifacts/release-portable-*/*
            artifacts/*/checksums.txt
          draft: false
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, '-alpha') || contains(github.event.inputs.version || github.ref_name, '-beta') || contains(github.event.inputs.version || github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 更新文档
  update-docs:
    needs: release
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Update README with latest release
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          DATE=$(date -u +'%Y-%m-%d')

          # Update badges and download links in README
          sed -i "s|v[0-9]\+\.[0-9]\+\.[0-9]\+|$VERSION|g" README.md || true
          sed -i "s|[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}|$DATE|g" README.md || true

      - name: Commit documentation updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md || true
          git commit -m "Update documentation for release ${{ github.event.inputs.version || github.ref_name }}" || true
          git push || true

  # 通知
  notify:
    needs: release
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify success
        if: success()
        run: |
          echo "✅ Release ${{ github.event.inputs.version || github.ref_name }} completed successfully!"
          echo "📦 Download: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version || github.ref_name }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Release ${{ github.event.inputs.version || github.ref_name }} failed!"
          echo "Check the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          echo "⚠️  Manual intervention may be required."}
          exit 1