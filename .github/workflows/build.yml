name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Build debug version'
        required: false
        default: 'true'
      release:
        description: 'Build release version'
        required: false
        default: 'true'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 版本信息准备
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-date: ${{ steps.version.outputs.build-date }}
      commit-hash: ${{ steps.version.outputs.commit-hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version info
        id: version
        run: |
          # 获取版本信息
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(node -p "require('./package.json').version")-dev+${GITHUB_SHA::7}
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build-date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "commit-hash=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

          echo "Version: $VERSION"
          echo "Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Commit: ${GITHUB_SHA::7}"

  # 代码质量检查
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript
        run: npm run lint

      - name: Type check
        run: npm run typecheck || true

      - name: Format check (Rust)
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Clippy check
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Test Rust code
        run: cargo test --all-features
        working-directory: src-tauri

  # 构建 Debug 版本
  build-debug:
    needs: [prepare, quality]
    if: github.event.inputs.debug != 'false'
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Debug)
        run: npm run build:dev
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}
          VITE_BUILD_DATE: ${{ needs.prepare.outputs.build-date }}
          VITE_COMMIT_HASH: ${{ needs.prepare.outputs.commit-hash }}
          VITE_DEBUG: "true"

      - name: Build Tauri (Debug)
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RUST_BACKTRACE: 1

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.suffix }}
          path: |
            src-tauri/target/debug/bundle/msi/*.msi
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/bundle/appimage/*.AppImage
            src-tauri/target/debug/bundle/dmg/*.dmg
            src-tauri/target/debug/bundle/deb/*.deb
            src-tauri/target/debug/bundle/rpm/*.rpm
          retention-days: 7

      - name: Upload Portable Debug Binary
        uses: actions/upload-artifact@v4
        with:
          name: debug-portable-${{ matrix.suffix }}
          path: |
            src-tauri/target/debug/*${{ matrix.ext }}
            !src-tauri/target/debug/deps/
            !src-tauri/target/debug/build/
            !src-tauri/target/debug/.fingerprint/
          retention-days: 7

  # 构建 Release 版本
  build-release:
    needs: [prepare, quality]
    if: github.event.inputs.release != 'false'
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (Release)
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version }}
          VITE_BUILD_DATE: ${{ needs.prepare.outputs.build-date }}
          VITE_COMMIT_HASH: ${{ needs.prepare.outputs.commit-hash }}
          VITE_DEBUG: "false"

      - name: Build Tauri (Release)
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RUST_BACKTRACE: 1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 30

      - name: Upload Portable Release Binary
        uses: actions/upload-artifact@v4
        with:
          name: release-portable-${{ matrix.suffix }}
          path: |
            src-tauri/target/release/*${{ matrix.ext }}
            !src-tauri/target/release/deps/
            !src-tauri/target/release/build/
            !src-tauri/target/release/.fingerprint/
          retention-days: 30

  # 创建 Release
  create-release:
    needs: [prepare, build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Serial Pilot v${{ needs.prepare.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Serial Pilot v${{ needs.prepare.outputs.version }}

            **Build Date**: ${{ needs.prepare.outputs.build-date }}
            **Commit**: ${{ needs.prepare.outputs.commit-hash }}

            ### Downloads

            #### Windows
            - **MSI Installer**: `serial-pilot_${{ needs.prepare.outputs.version }}_x64.msi`
            - **Portable**: `serial-pilot_${{ needs.prepare.outputs.version }}_x64.exe`

            #### macOS
            - **DMG**: `Serial Pilot_${{ needs.prepare.outputs.version }}_x64.dmg`
            - **App Bundle**: `Serial Pilot.app`

            #### Linux
            - **AppImage**: `serial-pilot_${{ needs.prepare.outputs.version }}_amd64.AppImage`
            - **DEB**: `serial-pilot_${{ needs.prepare.outputs.version }}_amd64.deb`
            - **RPM**: `serial-pilot_${{ needs.prepare.outputs.version }}_x86_64.rpm`

            ### Features
            - Dual-channel serial communication
            - Test case management
            - Real-time data monitoring
            - Cross-platform support

            ### Installation
            1. Download the appropriate installer for your platform
            2. Run the installer and follow the prompts
            3. Launch Serial Pilot

            For portable versions, simply download and run the executable.

            ### Debug Builds
            Debug builds with console output are available in the Actions artifacts.
          files: |
            artifacts/release-*/*
            artifacts/release-portable-*/*
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}